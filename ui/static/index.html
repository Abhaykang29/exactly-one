<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exactly Once</title>
<style>
  :root { --ink:#111; --muted:#666; --line:#ddd; --red:#c62828; --green:#1b7f3b; --amber:#b26a00; --blue:#1a4fd6; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background:#fff; color:var(--ink); font-size:20px; }
  header { padding:18px 28px 12px; border-bottom:2px solid var(--line); }
  h1 { margin:0; font-size:44px; letter-spacing:-0.5px; }
  .motto { color:var(--muted); font-size:22px; margin-top:2px; }
  .bar { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  button { font-size:19px; padding:10px 16px; border:2px solid var(--ink); background:#fff; border-radius:8px; cursor:pointer; font-weight:600; }
  button:hover { background:#f3f3f3; }
  button.primary { background:var(--ink); color:#fff; }
  button.danger { border-color:var(--red); color:var(--red); }
  button.on { background:#e8f0ff; border-color:var(--blue); color:var(--blue); }
  .banners { padding:0 28px; }
  .banner { margin-top:12px; padding:12px 16px; border-radius:8px; font-size:22px; font-weight:600; }
  .banner.red { background:#fdecea; color:var(--red); }
  .banner.blue { background:#e8f0ff; color:var(--blue); }
  .banner.amber { background:#fff4e0; color:var(--amber); }
  main { display:grid; grid-template-columns:1fr 1fr; gap:28px; padding:18px 28px 28px; }
  @media (max-width: 900px) { main { grid-template-columns:1fr; } }
  .col h2 { font-size:28px; margin:0 0 4px; }
  .col .sub { color:var(--muted); font-size:18px; margin-bottom:12px; }
  .stats { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .stat { border:2px solid var(--line); border-radius:10px; padding:12px 16px; }
  .stat .n { font-size:64px; font-weight:800; line-height:1.05; font-variant-numeric: tabular-nums; }
  .stat .l { font-size:19px; color:var(--muted); }
  .stat.bad { border-color:var(--red); }
  .stat.bad .n { color:var(--red); }
  .stat.good .n { color:var(--green); }
  .status { font-size:18px; margin:8px 0 0; color:var(--muted); }
  .feed { margin-top:16px; border-top:2px solid var(--line); }
  .feed h3 { font-size:22px; margin:12px 0 6px; }
  .row { display:flex; justify-content:space-between; gap:10px; padding:7px 4px; border-bottom:1px solid #eee; cursor:pointer; font-size:20px; }
  .row:hover { background:#f6f6f6; }
  .pill { font-weight:700; }
  .s-proven { color:var(--green); } .s-held { color:var(--amber); } .s-denied { color:var(--red); }
  .s-sent { color:var(--blue); } .s-intent { color:var(--muted); } .s-compensated { color:#6a1b9a; }
  .proof { color:var(--muted); font-family: ui-monospace, Menlo, monospace; font-size:17px; }
  dialog { border:2px solid var(--ink); border-radius:12px; padding:24px 28px; width:min(760px, 94vw); font-size:20px; }
  dialog::backdrop { background:rgba(0,0,0,.35); }
  dialog h2 { margin:0 0 12px; font-size:28px; }
  .kv { display:grid; grid-template-columns:200px 1fr; gap:8px 14px; }
  .kv .k { color:var(--muted); }
  pre { margin:0; white-space:pre-wrap; font-size:16px; background:#f7f7f7; padding:8px 10px; border-radius:6px; }
  .actions { display:flex; gap:10px; margin-top:18px; justify-content:flex-end; }
  .muted { color:var(--muted); }
  footer { padding:0 28px 22px; color:var(--muted); font-size:16px; }
</style>
</head>
<body>
<header>
  <h1>Exactly Once</h1>
  <div class="motto">Nothing counts without a receipt.</div>
  <div class="bar">
    <button class="primary" id="b-race">Start race</button>
    <button class="danger" id="b-crash">Crash both</button>
    <button id="b-drift">Bank changes its API</button>
    <button id="b-memory">Memory: on</button>
    <button class="danger" id="b-revoke">Revoke permission</button>
    <button id="b-reset">Reset</button>
  </div>
</header>

<div class="banners" id="banners"></div>

<main>
  <section class="col" id="col-baseline">
    <h2>Standard</h2>
    <div class="sub">LangGraph + MongoDB checkpointer</div>
    <div class="stats" data-agent="baseline"></div>
    <div class="status" id="st-baseline"></div>
  </section>
  <section class="col" id="col-once">
    <h2>With Exactly Once</h2>
    <div class="sub">same graph, every action gets a receipt</div>
    <div class="stats" data-agent="once"></div>
    <div class="status" id="st-once"></div>
    <div class="feed">
      <h3>Receipts <span class="muted" id="counts"></span></h3>
      <div id="feed"><div class="muted">No receipts yet. Press Start race.</div></div>
    </div>
  </section>
</main>
<footer id="foot"></footer>

<dialog id="card">
  <h2 id="c-title">Receipt</h2>
  <div class="kv" id="c-body"></div>
  <div class="actions">
    <button class="danger" id="c-reverse">Reverse this refund</button>
    <button id="c-close">Close</button>
  </div>
</dialog>

<script>
const $ = (s) => document.querySelector(s);
let S = null, openKey = null;

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: { "content-type": "application/json" },
                                body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const hhmmss = (iso) => iso ? new Date(iso).toLocaleTimeString([], { hour12: false }) : "";

const money = (c) => "$" + (c / 100).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function stat(label, n, kind, fmt) {
  const v = n === null || n === undefined ? "–" : fmt ? fmt(n) : n;
  const cls = kind === "bad" && n > 0 ? "bad" : kind === "bad" && n === 0 ? "good" : "";
  return `<div class="stat ${cls}"><div class="n">${v}</div><div class="l">${label}</div></div>`;
}

function render(s) {
  S = s;
  for (const a of ["baseline", "once"]) {
    const x = s.agents[a];
    document.querySelector(`.stats[data-agent=${a}]`).innerHTML =
      stat("crashes", x.crashes) + stat("refunds paid twice", x.dup_refunds, "bad") +
      stat("$ paid twice", x.dup_refund_cents, "bad", money) +
      stat("said done but wasn't", x.false_done, "bad") + stat("orders finished", x.finished);
    const st = x.world_up ? x.status : "world offline";
    $(`#st-${a}`).textContent = `${st}${x.held ? ` · ${x.held} held for a human` : ""}`;
  }
  const c = s.receipts || {};
  $("#counts").textContent = Object.keys(c).length ? "· " + Object.entries(c).map(([k, v]) => `${v} ${k}`).join(" · ") : "";
  $("#feed").innerHTML = s.feed.length ? s.feed.map((r) =>
    `<div class="row" data-key="${esc(r.key)}"><span>${esc(r.order_id)} ${esc(r.action)}:
      <span class="pill s-${esc(r.status)}">${esc(r.status)}</span>${r.memory ? " · memory" : ""}</span>
      <span class="proof">${esc(r.proof || r.reason || "")}</span></div>`).join("")
    : `<div class="muted">No receipts yet. Press Start race.</div>`;

  const b = [];
  if (s.grant.revoked) {
    const stopped = s.agents.once.status === "stopped" ? ", agent stopped" : "";
    b.push(`<div class="banner red">Permission revoked by ${esc((s.grant.revoked_by || "").split("@")[0])} at ${hhmmss(s.grant.revoked_at)}${stopped}</div>`);
  }
  if (s.memory.recalled) {
    b.push(`<div class="banner blue">Memory recalled: fix for bank field rename (learned from ${esc(s.memory.recalled.learned_from)}, proven)</div>`);
  }
  if (s.drift) b.push(`<div class="banner amber">Bank changed its API (refund fields renamed)</div>`);
  $("#banners").innerHTML = b.join("");

  $("#b-memory").textContent = `Memory: ${s.memory.on ? "on" : "off"} (${s.memory.count})`;
  $("#b-memory").classList.toggle("on", s.memory.on);
  $("#b-drift").classList.toggle("on", s.drift);
  $("#b-race").disabled = s.race_running;
  $("#b-race").textContent = s.race_running ? "Race running…" : "Start race";
  $("#foot").textContent = s.run_id ? `run ${s.run_id}` : "";
}

async function poll() {
  try { render(await api("GET", "/api/state")); } catch (e) { console.warn("state", e.message); }
}
setInterval(poll, 1000); poll();

const act = (fn) => async () => { try { await fn(); } catch (e) { alert(e.message); } poll(); };
$("#b-race").onclick = act(() => api("POST", "/api/race", { orders: 20, crash_prob: 0, chaos: "default" }));
$("#b-crash").onclick = act(() => api("POST", "/api/crash"));
$("#b-drift").onclick = act(() => api("POST", "/api/drift", { on: !(S && S.drift) }));
$("#b-memory").onclick = act(() => api("POST", "/api/memory", { on: !(S && S.memory.on) }));
$("#b-revoke").onclick = act(() => S && S.grant.revoked ? api("POST", "/api/regrant") : api("POST", "/api/revoke"));
$("#b-reset").onclick = act(() => api("POST", "/api/reset"));

function kv(k, v) { return `<div class="k">${esc(k)}</div><div>${v}</div>`; }
function pre(o) { return `<pre>${esc(JSON.stringify(o, null, 2))}</pre>`; }

async function openCard(key) {
  openKey = key;
  const r = await api("GET", "/api/receipt/" + encodeURIComponent(key));
  const g = (r.grant || [])[0] || {};
  const mems = (r.memories || []).map((m) =>
    `${esc(m._id)} (learned from ${esc((m.source_receipts[0] || "").split(":")[1] || m.source_receipts[0])}, proven · ${esc(m.status)})`).join("<br>") || "none";
  const comps = (r.compensations || []).map((c) => `${esc(c._id)}: <span class="s-${esc(c.status)} pill">${esc(c.status)}</span>`).join("<br>");
  $("#c-title").innerHTML = `${esc(r.order_id)} ${esc(r.tool)}: <span class="s-${esc(r.status)}">${esc(r.status)}</span>`;
  $("#c-body").innerHTML =
    kv("who allowed it", `${esc(g._id || r.authority.grant_id)} · issued by ${esc(g.issued_by || r.authority.issued_by || "?")}`) +
    kv("decision (frozen)", pre(r.decision)) +
    kv("memory used", mems) +
    kv("evidence", r.evidence ? pre(r.evidence) : `<span class="muted">${esc(r.held_reason || "not proven yet")}</span>`) +
    kv("attempts", `${r.attempts ?? 0}${r.first_try_failed ? " · first try failed (schema)" : ""}${r.reconciled ? " · reconciled after crash" : ""}`) +
    (comps ? kv("reversed by", comps) : "");
  $("#c-reverse").style.display = r.tool === "bank.refund" && r.status === "proven" ? "" : "none";
  if (!$("#card").open) $("#card").showModal();
}
$("#feed").onclick = (e) => { const row = e.target.closest(".row"); if (row) openCard(row.dataset.key).catch((x) => alert(x.message)); };
$("#c-close").onclick = () => $("#card").close();
$("#c-reverse").onclick = async () => {
  try { await api("POST", "/api/reverse/" + encodeURIComponent(openKey)); await openCard(openKey); }
  catch (e) { alert(e.message); }
};
</script>
</body>
</html>
